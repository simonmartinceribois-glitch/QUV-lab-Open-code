# Pont ChatGPT → GitHub → OpenCode → GitHub (QUV-Lab)
# Déclenché par un commentaire `/oc` ou `/opencode` (commande en début de
# commentaire uniquement) émis par le PROPRIÉTAIRE du dépôt sur :
#   - une Issue portant le label `opencode` (contrôle positif, dépôt public),
#   - un commentaire de review PR.
# Tout commentaire d'un utilisateur externe est ignoré.
# OpenCode (mode use_github_token) lit tout le fil, modifie le code, lance les
# tests (cf. AGENTS.md), crée une branche, pousse, ouvre une PR et répond sur le fil.
# Secrets requis : OPENCODE_API_KEY (modèle) ; GITHUB_TOKEN fourni par le runner.

name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (github.event_name == 'issue_comment' &&
       contains(github.event.issue.labels.*.name, 'opencode') &&
       github.event.comment.user.login == github.repository_owner &&
       (startsWith(github.event.comment.body, '/oc') ||
        startsWith(github.event.comment.body, '/opencode'))) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.comment.user.login == github.repository_owner &&
       (startsWith(github.event.comment.body, '/oc') ||
        startsWith(github.event.comment.body, '/opencode')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true