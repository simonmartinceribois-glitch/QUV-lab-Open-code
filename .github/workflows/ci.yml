# QUV-Lab — CI (source de vérité GitHub)
# Vérifie : typage strict (tsc) + suites de tests scientifiques (tsx) + build Vite.
# `npm test` exécute run_tests.ts : le total est calculé par le runner lui-même
# (somme des suites, dont Gate 57, Gate 58 et Verrou PERSOZ/Témoin) — aucun nombre
# n'est figé ici pour éviter toute divergence future entre le workflow et la réalité.
# `npm ci` : le lockfile est versionné (reproductible, échoue s'il est désynchronisé).

name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'refactor/**', 'audit/**']
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Scientific test suites
        run: npm test

      - name: Production build
        run: npm run build
