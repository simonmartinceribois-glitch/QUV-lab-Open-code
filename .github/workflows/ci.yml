# QUV-Lab — CI (source de vérité GitHub)
# Vérifie : typage strict (tsc) + 195 tests scientifiques (tsx) + build Vite.
# `npm ci` : le lockfile est versionné (reproductible, échoue s'il est désynchronisé).
# État au 2026-09-04 : 195/195 verts, Gate 2.2 7/7 (l'ancienne mention « CI rouge attendue »
# venait d'un test-results.txt obsolète — voir docs/audits/INITIAL_AUDIT.md C1bis).

name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'refactor/**', 'audit/**']
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Scientific test suites (195 tests)
        run: npm test

      - name: Production build
        run: npm run build
